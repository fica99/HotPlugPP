name: Bug report
description: Track a defect for multi-agent triage and fix.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: bug
    attributes:
      label: Current behavior
      description: What is wrong?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include exact commands, plugin paths, and platform details.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact and acceptance criteria
      description: Define observable criteria for considering the bug fixed.
      placeholder: |
        Impact:
        Acceptance criteria:
        1. ...
        2. ...
    validations:
      required: true
