name: Documentation

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**.md'
      - 'docs/**'
  push:
    branches: [ main ]
    paths:
      - '**.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Lint Markdown files
        run: npx --yes markdownlint-cli2 '**/*.md' '#node_modules' '#build'
