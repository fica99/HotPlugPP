name: Multi-Agent Pipeline

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number
      base_branch:
        description: 'Base branch to create task branches from'
        required: false
        type: string
        default: 'main'
      provider:
        description: 'AI provider to use for agent roles'
        required: false
        type: choice
        default: 'codex'
        options:
          - codex
          - github-copilot
      role:
        description: 'Single agent role to run (leave empty for full pipeline)'
        required: false
        type: choice
        default: ''
        options:
          - ''
          - planner
          - implementer
          - tester
          - security-checker
          - reviewer
          - doc-checker

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-pipeline:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent-run')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenAI Codex CLI
        if: ${{ github.event.inputs.provider == 'codex' || github.event.inputs.provider == '' }}
        run: npm install -g @openai/codex

      - name: Restore handoff files for single-role run
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.role != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.inputs.issue_number }}
          REPO: ${{ github.repository }}
        run: |
          ARTIFACT_NAME="handoff-issue-${ISSUE_NUMBER}"
          # Find the most recent workflow run that uploaded the handoff artifact for this issue,
          # then download it so prior agents' outputs are available to the current agent.
          RUN_ID=$(gh api "repos/${REPO}/actions/artifacts" \
            --jq "[.artifacts[] | select(.name == \"${ARTIFACT_NAME}\" and .expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty" \
            2>/dev/null || true)
          if [ -n "$RUN_ID" ]; then
            echo "Restoring handoffs from run ${RUN_ID}..."
            mkdir -p ../HotPlugPP-handoff
            gh run download "${RUN_ID}" --name "${ARTIFACT_NAME}" --dir ../HotPlugPP-handoff/ || echo "Warning: download failed, continuing without previous handoffs."
          else
            echo "No previous handoff artifact found for issue ${ISSUE_NUMBER}."
          fi

      - name: Set up agent worktrees
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          BASE_BRANCH: ${{ github.event.inputs.base_branch || 'main' }}
        run: |
          & ./scripts/setup-agent-worktrees.ps1 `
            -IssueNumber ([int]$env:ISSUE_NUMBER) `
            -BaseBranch $env:BASE_BRANCH
        shell: pwsh

      - name: Run multi-agent pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
          SINGLE_ROLE: ${{ github.event.inputs.role }}
          PROVIDER: ${{ github.event.inputs.provider || 'codex' }}
        run: |
          $cmdArgs = @{
            IssueNumber = ([int]$env:ISSUE_NUMBER)
            BaseRoot    = "."
            HandoffRoot = "../HotPlugPP-handoff"
            Provider    = $env:PROVIDER
          }
          $role = $env:SINGLE_ROLE
          # doc-checker is the final agent and creates the PR, so it always needs -PublishToGitHub
          if (-not $role -or $role -eq "doc-checker") {
            $cmdArgs["PublishToGitHub"] = $true
          }
          if ($role) {
            $cmdArgs["SingleRole"] = $role
          }
          & ./scripts/run-multi-agent.ps1 @cmdArgs
        shell: pwsh

      - name: Upload handoff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
          path: ../HotPlugPP-handoff/
          retention-days: 30