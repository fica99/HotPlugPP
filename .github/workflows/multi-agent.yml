name: Multi-Agent Pipeline

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process'
        required: true
        type: number

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-pipeline:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent-run')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install OpenAI Codex CLI
        run: npm install -g @openai/codex

      - name: Set up agent worktrees
        run: pwsh ./scripts/setup-agent-worktrees.ps1

      - name: Run multi-agent pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $issueNumber = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            ${{ github.event.inputs.issue_number }}
          } else {
            ${{ github.event.issue.number }}
          }
          pwsh ./scripts/run-multi-agent.ps1 `
            -IssueNumber $issueNumber `
            -PublishToGitHub `
            -BaseRoot . `
            -HandoffRoot ../HotPlugPP-handoff
        shell: pwsh

      - name: Upload handoff artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-issue-${{ github.event.issue.number || github.event.inputs.issue_number }}
          path: ../HotPlugPP-handoff/
          retention-days: 30
